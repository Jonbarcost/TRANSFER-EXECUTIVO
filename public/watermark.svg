      <path d="M-150 30 C-110 18 -70 10 -40 6 L-36 20 C-70 26 -110 34 -150 30 Z" fill="var(--c1)"/>
      <path d="M-160 44 C-118 36 -78 28 -42 22 L-40 30 C-80 38 -120 46 -160 44 Z" fill="var(--c2)"/>
      <ellipse cx="0" cy="10" rx="48" ry="17" fill="var(--c1)" transform="rotate(-8)"/>
      <circle cx="48" cy="-6" r="15" fill="var(--c1)"/>
      <circle cx="52" cy="-9" r="5" fill="#fff"/>
      <circle cx="53" cy="-9" r="2.2" fill="#222"/>
      <path d="M60 -12 C76 -14 82 0 72 12 C70 4 66 0 58 0 Z" fill="#2b2b2b"/>
