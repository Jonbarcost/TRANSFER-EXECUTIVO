    <path d="M813 318 L837 318 L832 256 L818 256 Z"/>
    <path d="M766 252 C790 248 810 247 825 247 C840 247 860 248 884 252 L884 260 C860 258 840 258 825 258 C810 258 790 258 766 260 Z"/>
