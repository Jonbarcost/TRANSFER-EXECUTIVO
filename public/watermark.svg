      <path d="M-10 4 C6 -24 26 -54 58 -78 C46 -50 34 -26 18 2 Z" fill="var(--c3)"/>
      <path d="M-20 14 C-4 46 18 82 64 104 C50 70 36 44 20 16 Z" fill="var(--c2)" opacity=".85"/>
    </g>
    <!-- Macaco-prego sentado: corpo escuro, rosto claro e o topete ("prego") -->
    <g id="monkey">
      <path d="M-6 40 C-60 60 -70 120 -30 140 C-10 150 6 134 -8 124 C-36 112 -30 74 4 56 Z" fill="#5a3b22"/>
      <ellipse cx="10" cy="30" rx="30" ry="40" fill="#6b4728"/>
      <circle cx="12" cy="-22" r="24" fill="#6b4728"/>
      <ellipse cx="14" cy="-16" rx="16" ry="15" fill="#e8c9a0"/>
      <path d="M-6 -36 C2 -54 24 -54 32 -36 C22 -44 6 -44 -6 -36 Z" fill="#2e1d10"/>
      <circle cx="8" cy="-20" r="2.6" fill="#2e1d10"/>
      <circle cx="20" cy="-20" r="2.6" fill="#2e1d10"/>
      <path d="M9 -8 C12 -5 16 -5 19 -8" stroke="#2e1d10" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M30 10 C50 22 56 44 46 62" stroke="#6b4728" stroke-width="12" fill="none" stroke-linecap="round"/>
      <path d="M-10 14 C-24 30 -22 50 -12 62" stroke="#6b4728" stroke-width="12" fill="none" stroke-linecap="round"/>
      <path d="M-6 66 C-10 76 -2 82 8 80 M30 66 C34 76 26 82 16 80" stroke="#5a3b22" stroke-width="13" fill="none" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Céu: araras -->
  <use href="#macaw" transform="translate(250 170) rotate(-10) scale(1.15)" style="--c1:#1f63c6;--c2:#164a9a;--c3:#f2c230"/>
  <use href="#macaw" transform="translate(470 110) rotate(-4) scale(.85)" style="--c1:#d3262b;--c2:#2a6fd6;--c3:#f2c230"/>

  <!-- Pão de Açúcar e Urca -->
  <path d="M930 800 C950 640 990 470 1060 452 C1120 440 1150 560 1170 800 Z" fill="#2f6f5e"/>
  <path d="M860 800 C880 720 900 690 930 690 C960 690 975 740 985 800 Z" fill="#3f8a6f"/>

  <!-- Corcovado com o Cristo Redentor -->
  <path d="M420 800 C520 700 600 560 700 470 C760 410 790 360 812 344 C826 336 838 344 848 362 C890 440 960 560 1000 800 Z" fill="#2e6150"/>
  <g fill="#e9e4da" stroke="#cfc8b8" stroke-width="1">
